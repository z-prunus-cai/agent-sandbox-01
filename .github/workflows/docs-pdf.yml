name: docs-pdf

# 设计文档 §6 CI 集成:
#  - PR 时构建(校验文档没写坏)
#  - main 合并时发布(上传 artifact)
on:
  pull_request:
    paths:
      - "docs/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/docs-pdf.yml"
  push:
    branches: [main]

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 容器只需要一个 JDK(设计 §2 关键点:无 gem/apt/npm install)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # 缓解已知坑 1(首次构建慢):缓存 ~/.gradle
      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Build PDF
        run: ./gradlew asciidoctorPdf --no-daemon

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: design-docs-pdf
          path: build/docs/pdf/*.pdf
          if-no-files-found: error
