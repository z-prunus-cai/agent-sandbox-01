name: docs-confluence

# Git 为唯一事实来源 → 单向发布到 Confluence
#  - PR:convertOnly 干跑,校验文档没写坏(不连 Confluence,无需凭据)
#  - main 合并:发布到 Confluence
on:
  pull_request:
    paths:
      - "docs/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/docs-confluence.yml"
  push:
    branches: [main]

jobs:
  convert-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # PlantUML 把中文光栅化进 PNG,需要构建环境有 CJK 字体
      - name: Install CJK font (for PlantUML Chinese labels)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - uses: gradle/actions/setup-gradle@v4
      - name: Convert only (validate)
        run: ./gradlew confluenceConvert --no-daemon

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install CJK font (for PlantUML Chinese labels)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - uses: gradle/actions/setup-gradle@v4
      - name: Publish to Confluence
        env:
          CONFLUENCE_URL: ${{ secrets.CONFLUENCE_URL }}
          CONFLUENCE_SPACE_KEY: ${{ secrets.CONFLUENCE_SPACE_KEY }}
          CONFLUENCE_ANCESTOR_ID: ${{ secrets.CONFLUENCE_ANCESTOR_ID }}
          CONFLUENCE_USERNAME: ${{ secrets.CONFLUENCE_USERNAME }}
          CONFLUENCE_PASSWORD: ${{ secrets.CONFLUENCE_API_TOKEN }}
          VERSION_MESSAGE: "Published from ${{ github.sha }}"
        run: ./gradlew confluencePublish --no-daemon
