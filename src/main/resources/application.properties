spring.main.web-application-type=none
spring.main.banner-mode=off
# Circular references are OFF by default in Boot 2.6+; we opt back in ONLY to
# demonstrate step 3 (getEarlyBeanReference / the three-level cache).
spring.main.allow-circular-references=true
# Quiet Spring's own INFO logging so our System.out evidence stands alone.
logging.level.root=WARN
# Feeds @Value("${order.timeout:30}") in OrderService (step 5).
order.timeout=30
