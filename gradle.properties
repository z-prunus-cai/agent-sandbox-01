# ---------------------------------------------------------------------------
# 版本锁定(设计决策 5:五个版本全部显式声明,禁止插件填默认值漂移)
# ---------------------------------------------------------------------------
# 1) Gradle 插件版本         -> build.gradle.kts 的 plugins {} 块
# 2) asciidoctorj            -> 转换引擎(JRuby 封装)
# 3) asciidoctorj-pdf        -> PDF 后端(内嵌 asciidoctor-pdf gem)
# 4) asciidoctorj-diagram    -> 图表(内嵌 asciidoctor-diagram gem)
# 5) jruby                   -> 底层 Ruby 运行时
asciidoctorGradlePluginVersion=4.0.4
asciidoctorjVersion=3.0.0
asciidoctorjPdfVersion=2.3.19
asciidoctorjDiagramVersion=2.3.1
jrubyVersion=9.4.8.0

# JRuby 启动优化(缓解已知坑 1:首次构建慢)
org.gradle.jvmargs=-Xmx2g
org.gradle.caching=true
