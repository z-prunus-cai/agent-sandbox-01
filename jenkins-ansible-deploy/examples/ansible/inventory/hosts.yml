# 只描述主机与组的关系，不写变量：变量放在 group_vars/ 与 host_vars/。
# deploy_targets 的每个子组是一个发布对象，Jenkins 参数页上的主机组列表由这里生成。
all:
  children:
    deploy_targets:
      children:
        web:
          hosts:
            web-01:
            web-02:
        api:
          hosts:
            api-01:
        worker:
          hosts:
            worker-01:
            worker-02:
