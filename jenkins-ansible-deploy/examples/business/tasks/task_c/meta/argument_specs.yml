argument_specs:
  main:
    short_description: Example task C - has a choice and a boolean parameter
    options:
      task_c_mode:
        type: str
        default: plan
        choices: [plan, apply]
        description: Run mode
      task_c_verbose:
        type: bool
        default: false
        description: Whether to print details
      task_c_label:
        type: str
        default: ""
        description: Extra label, may be empty
