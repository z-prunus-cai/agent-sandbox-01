argument_specs:
  main:
    short_description: Example task B - checks a file of the template on the Jenkins node
    options:
      task_b_path:
        type: str
        default: business/inventory/hosts.yml
        description: File path relative to the template root, not absolute and without ..
      task_b_min_bytes:
        type: int
        default: 1
        description: Smallest allowed file size in bytes
