# Host variables the deployment needs, all from the inventory; Ansible checks types and presence before the role runs
argument_specs:
  main:
    short_description: Deploy the application (placeholder - checks the variables and prints the planned actions, changes no host)
    options:
      app_name:
        type: str
        required: true
        description: Application name, also the name of its install directory
      app_version:
        type: str
        required: true
        description: Version to deploy
      app_port:
        type: int
        required: true
        description: Port the application listens on
      app_max_connections:
        type: int
        required: true
        description: Maximum number of connections
      app_base_dir:
        type: path
        required: true
        description: Parent directory of the install directory
      app_run_user:
        type: str
        required: true
        description: System user that runs the application
      app_api_token:
        type: str
        required: true
        description: Token the application uses for an external API (from the vault)
