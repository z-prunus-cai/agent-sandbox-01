# Runs one role under business/tasks with the extra vars Jenkins passes: the task's parameters, task_role, task_hosts,
# and task_review_mode, task_review_file for a task that asks for a review before it runs
- name: "Task {{ task_role }}"
  hosts: "{{ task_hosts }}"
  gather_facts: false
  tasks:
    - name: "Run {{ task_role }}"
      ansible.builtin.include_role:
        name: "{{ task_role }}"
